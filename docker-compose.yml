# Infrastructure only:        docker compose up -d --wait
# Infrastructure + services:  docker compose --profile apps up -d --build --wait
services:
  kafka:
    image: apache/kafka:3.8.0
    container_name: dns-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,INTERNAL://:29092
      # PLAINTEXT is for clients on the host, INTERNAL is for containers on the compose network.
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,INTERNAL://kafka:29092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 20

  redis:
    image: redis:7.4-alpine
    container_name: dns-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  localstack:
    image: localstack/localstack:3.8
    container_name: dns-localstack
    ports:
      - "4566:4566"
    environment:
      SERVICES: sns,sqs
      AWS_DEFAULT_REGION: us-east-1
    volumes:
      - ./localstack/init-aws.sh:/etc/localstack/init/ready.d/init-aws.sh
    healthcheck:
      # The init script creates this file after all topics, queues and subscriptions exist.
      test: ["CMD", "test", "-f", "/tmp/notification-infra-ready"]
      interval: 5s
      timeout: 3s
      retries: 30

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: dns-kafka-ui
    profiles: ["tools"]
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on:
      kafka:
        condition: service_healthy

  # ---------------------------------------------------------------- application services
  notification-api:
    profiles: ["apps"]
    build:
      context: .
      args:
        MODULE: notification-api
    container_name: dns-api
    ports:
      - "8080:8080"
    environment:
      KAFKA_BOOTSTRAP: kafka:29092
      REDIS_HOST: redis
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck: &app-health
      test: ["CMD-SHELL", "wget -qO- http://localhost:$${SERVER_PORT:-8080}/actuator/health | grep -q UP"]
      interval: 5s
      timeout: 3s
      retries: 30

  notification-dispatcher:
    profiles: ["apps"]
    build:
      context: .
      args:
        MODULE: notification-dispatcher
    container_name: dns-dispatcher
    ports:
      - "8081:8081"
    environment:
      SERVER_PORT: 8081
      KAFKA_BOOTSTRAP: kafka:29092
      REDIS_HOST: redis
      AWS_ENDPOINT: http://localstack:4566
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
      localstack:
        condition: service_healthy
    healthcheck: *app-health

  notification-worker:
    profiles: ["apps"]
    build:
      context: .
      args:
        MODULE: notification-worker
    container_name: dns-worker
    ports:
      - "8082:8082"
    environment:
      SERVER_PORT: 8082
      REDIS_HOST: redis
      AWS_ENDPOINT: http://localstack:4566
      SIMULATED_FAILURE_RATE: ${SIMULATED_FAILURE_RATE:-0.2}
    depends_on:
      redis:
        condition: service_healthy
      localstack:
        condition: service_healthy
    healthcheck: *app-health
