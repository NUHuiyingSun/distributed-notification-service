name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & unit tests (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ['17', '21']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Build and test
        run: mvn -B -ntp verify

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-jdk${{ matrix.java }}
          path: '**/target/surefire-reports/'

  e2e:
    name: End-to-end (Kafka + Redis + LocalStack)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Start infrastructure
        run: docker compose up -d --wait

      - name: Package services
        run: mvn -B -ntp -DskipTests package

      - name: Start services
        env:
          SIMULATED_FAILURE_RATE: '0'
        run: |
          mkdir -p logs
          for m in notification-api notification-dispatcher notification-worker; do
            nohup java -jar "$m"/target/"$m"-*.jar > "logs/$m.log" 2>&1 &
          done

      - name: Wait for services
        run: ./scripts/wait-for-services.sh

      - name: Run end-to-end checks
        run: ./scripts/e2e-test.sh

      - name: Show logs
        if: failure()
        run: |
          for f in logs/*.log; do echo "::group::$f"; tail -n 300 "$f"; echo "::endgroup::"; done
          echo "::group::docker compose"; docker compose logs --tail 200; echo "::endgroup::"

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs
          path: logs/

  docker:
    name: Docker images build
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module: [notification-api, notification-dispatcher, notification-worker]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          build-args: MODULE=${{ matrix.module }}
          tags: ${{ matrix.module }}:ci
          cache-from: type=gha,scope=${{ matrix.module }}
          cache-to: type=gha,mode=max,scope=${{ matrix.module }}
